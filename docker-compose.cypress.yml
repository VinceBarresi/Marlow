services:
  cypress-api: &cypress
    build:
      context: .
      dockerfile: Dockerfile.cypress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CYPRESS_BASE_URL: http://host.docker.internal:5173
    volumes:
      - ./cypress/screenshots:/work/cypress/screenshots
      - ./cypress/videos:/work/cypress/videos
    command: ["run", "--spec", "cypress/tests/api/**/*.ts"]

  cypress-e2e:
    <<: *cypress
    command: ["run", "--spec", "cypress/tests/e2e/**/*.cy.ts"]
