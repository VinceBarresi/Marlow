name: CI

on:
  push:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install shop dependencies
        working-directory: web
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Prettier
        run: npm run format:check

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: ESLint
        run: npm run lint

  cypress:
    name: Cypress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            services/catalog/package-lock.json
            services/orders/package-lock.json
            web/package-lock.json
            frontends/catalog/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix services/catalog
          npm ci --prefix services/orders
          npm ci --prefix web
          npm ci --prefix frontends/catalog
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Cypress (Docker workers)
        run: npm run cypress:docker

      - name: Shop logs
        if: failure()
        run: tail -n 80 .e2e-logs/*.log || true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-allure-report
          path: |
            allure-report/
            allure-results/
            cypress/screenshots/
          if-no-files-found: ignore

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            services/catalog/package-lock.json
            services/orders/package-lock.json
            web/package-lock.json
            frontends/catalog/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix services/catalog
          npm ci --prefix services/orders
          npm ci --prefix web
          npm ci --prefix frontends/catalog
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Playwright (Docker shards)
        run: npm run playwright:docker

      - name: Shop logs
        if: failure()
        run: tail -n 80 .e2e-logs/*.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
